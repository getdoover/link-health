[project]
name = "link-health"
version = "0.1.0"
description = "Doover cloud processor reporting the communications link and power health of a remote field node"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.18.8",
]

[project.scripts]
export-config-processor = "link_health.app_config:export"
export-ui-processor = "link_health.app_ui:export"
export-notifications = "link_health.app_notifications:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/link_health",
]

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
